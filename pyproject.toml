[project]
name = "usda-branded-food-lab1"
version = "0.1.0"
description = "Лабораторная работа 1: обработка и очистка данных USDA Branded Foods"
requires-python = "==3.12.14"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=17.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "matplotlib>=3.8",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1"
ipykernel = "^6.29"
ruff = "^0.6"

[tool.ruff]
line-length = 100

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
